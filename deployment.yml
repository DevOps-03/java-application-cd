apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-java
  namespace: hello-java

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-java

  template:
    metadata:
      labels:
        app: hello-java

    spec:
      containers:
        - name: hello-java

          # Docker Hub image
          image: april2026dev/hello-java:13

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
